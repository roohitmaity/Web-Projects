<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Based SIEM System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas"></i> AI-Based SIEM System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                                href="{{ url_for('index') }}">
                                <i class="fas fa-home"></i> Dashboard
                            </a>
                        </li>
    <!-- ADD THIS NEW IMPORT TAB 👇 -->
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'anomalies' %}active{% endif %}"
                                href="{{ url_for('anomalies') }}">
                                <i class="fas fa-exclamation-triangle"></i> Anomalies
                            </a>
                        </li>
    <!-- ... rest of your nav items ... -->
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'rules' %}active{% endif %}"
                                href="{{ url_for('rules') }}">
                                <i class="fas fa-gavel"></i> Rules
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'evolution' %}active{% endif %}"
                                href="{{ url_for('evolution') }}">
                                <i class="fas fa-chart-line"></i> Evolution
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.endpoint == 'import_page' %}active{% endif %}"
                                href="{{ url_for('import_page') }}">
                                <i class="fas fa-upload"></i> Import Dataset
                            </a>
                        </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer mt-4 py-3">
        <div class="container text-center">
            <span style="color: black">
                Self-Evolving SIEM System | All Copyright ©️Rohit Maity
            </span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
